name: Render keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render kontrol endpoint
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "CRON_URL secret is not set."
            exit 1
          fi
          curl -sS --max-time 90 -o /dev/null -w "HTTP:%{http_code}\n" "$CRON_URL"
